<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test cart (GBP)</title>
    <!-- Test fixture: a fake marketplace checkout to screenshot and feed to Cart Check. Not part of the app. -->
    <style>
      body { margin: 0; font: 15px/1.4 -apple-system, Helvetica, Arial, sans-serif; background: #f5f5f5; color: #222; }
      .bar { background: #ee4d2d; color: #fff; padding: 14px 16px; font-weight: 700; font-size: 17px; }
      .card { background: #fff; margin: 10px 0; padding: 14px 16px; }
      .shop { font-weight: 700; margin-bottom: 10px; }
      .item { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #eee; }
      .thumb { width: 64px; height: 64px; background: #ddd; border-radius: 4px; flex: none; }
      .name { font-size: 14px; }
      .var { color: #888; font-size: 12px; }
      .price { color: #ee4d2d; font-weight: 600; margin-top: 4px; }
      .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
      .total { font-weight: 700; font-size: 16px; color: #ee4d2d; }
      .pay { border: 1px solid #ee4d2d; border-radius: 4px; padding: 10px; font-size: 14px; }
      .cta { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 16px; }
      .btn { background: #ee4d2d; color: #fff; padding: 12px 22px; font-weight: 700; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="bar">Checkout · ASOS</div>
    <div class="card">
      <div class="shop">ASOS · Your bag</div>
      <div class="item">
        <div class="thumb"></div>
        <div>
          <div class="name">Oversized Denim Jacket</div>
          <div class="var">Colour: Light blue · Size: L</div>
          <div class="price">£24.99 &nbsp; Qty 1</div>
        </div>
      </div>
      <div class="item">
        <div class="thumb"></div>
        <div>
          <div class="name">White Canvas Trainers</div>
          <div class="var">Size: UK 8</div>
          <div class="price">£22.00 &nbsp; Qty 1</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row"><span>Subtotal</span><span>£46.99</span></div>
      <div class="row"><span>Delivery</span><span>£4.53</span></div>
      <div class="row"><span>Promo code STUDENT10</span><span>-£1.50</span></div>
      <div class="row total"><span>Total to pay</span><span>£50.02</span></div>
    </div>
    <div class="card">
      <div class="row"><span>Payment</span><span>Visa •••• 4242</span></div>
    </div>
    <div class="cta"><span class="total">Total £50.02</span><span class="btn">Pay now</span></div>
  </body>
</html>
